<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Minhas contas</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Contas">
  <style>
:root {
  --bg: #f2f4f8; --card: #ffffff; --text: #151a23; --muted: #6b7482; --line: #e7eaf0;
  --accent: #3b5bdb; --accent2: #5f3dc4; --good: #12a150; --bad: #e03131; --warn: #e8890c;
  --shadow: 0 1px 2px rgba(20,30,60,.05), 0 4px 14px rgba(20,30,60,.05);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0f14; --card: #171a21; --text: #eceef2; --muted: #98a1b0; --line: #262b35; --accent: #7c93ff; --accent2: #9775fa; --shadow: none; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 8px; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 14px; }
h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 4px 8px; }
.card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card[data-act] { cursor: pointer; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card .row + .row { margin-top: 6px; }
.muted { color: var(--muted); font-size: 14px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0 6px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), #40c98a); border-radius: 4px; }
button { font: inherit; cursor: pointer; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; }
.btn.sec { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 500; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.fab { width: 100%; margin: 4px 0 12px; padding: 13px; }

.hero { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: 0; padding: 18px; }
.hero.neg { background: linear-gradient(135deg, #e03131, #c2255c); }
.hero .lbl { font-size: 13px; opacity: .85; }
.hero .amt { font-size: 38px; font-weight: 700; letter-spacing: -.03em; margin: 2px 0 14px; }
.hero .pair { display: flex; gap: 10px; }
.hero .pair > div { flex: 1; background: rgba(255,255,255,.16); border-radius: 12px; padding: 9px 12px; }
.hero .pair span { display: block; font-size: 12px; opacity: .85; }
.hero .pair b { font-size: 17px; }
.hero .foot { font-size: 13px; opacity: .85; margin-top: 12px; }

nav {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom));
  width: min(calc(100% - 20px), 620px); display: flex; padding: 6px;
  background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 8px 30px rgba(20,30,60,.18); z-index: 10;
}
nav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0;
  padding: 8px 0 6px; color: var(--muted); font-size: 10.5px; font-weight: 500; border-radius: 16px;
}
nav button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }

.item { display: flex; align-items: center; gap: 12px; }
.item .chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; color: #fff; padding: 0; font-weight: 700; }
.item .chk.on { background: var(--good); border-color: var(--good); }
.item .grow { flex: 1; min-width: 0; }
.item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.item.paid .name { text-decoration: line-through; color: var(--muted); }
.monthbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.monthbar h1 { margin: 0; font-size: 20px; }
.monthbar button { background: var(--card); border: 1px solid var(--line); border-radius: 50%; width: 40px; height: 40px; color: var(--text); font-size: 20px; box-shadow: var(--shadow); }
dialog { border: 0; border-radius: 20px; padding: 18px; width: min(92vw, 420px); background: var(--card); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(10,12,20,.55); backdrop-filter: blur(3px); }
dialog h1 { font-size: 20px; }
label { display: block; font-size: 13px; color: var(--muted); margin-top: 12px; }
input, select, textarea {
  width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: var(--text); margin-top: 4px;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 12px; }
.ev { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; }
tfoot td { font-weight: 700; border-bottom: 0; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .dow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
.cal .day { aspect-ratio: 1; background: var(--bg); border: 1px solid transparent; border-radius: 12px; color: var(--text); padding: 4px 0 0; display: flex; flex-direction: column; align-items: center; font-size: 14px; }
.cal .day.today { border-color: var(--accent); font-weight: 700; }
.cal .dots { display: flex; gap: 3px; margin-top: 3px; min-height: 8px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.dot.g { background: var(--good); } .dot.r { background: var(--bad); } .dot.k { background: var(--muted); opacity: .6; }
.legend { margin-top: 10px; font-size: 12px; }
svg.chart { width: 100%; height: auto; display: block; }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; }
@media print { nav, .noprint { display: none !important; } body { background: #fff; color: #000; } .card { box-shadow: none; } }
</style>
</head>
<body>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="resumo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Resumo</button>
    <button data-tab="mes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês</button>
    <button data-tab="dividas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Dívidas</button>
    <button data-tab="contas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Contas</button>
    <button data-tab="rel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Relat.</button>
    <button data-tab="config"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Config</button>
  </nav>
  <dialog id="dlg"><form method="dialog" id="form"></form></dialog>
  <script>
'use strict';

// ---------- utilitários ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n) => new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(n || 0);
const sum = (arr, f) => arr.reduce((t, x) => t + (f(x) || 0), 0);
const pad = (n) => String(n).padStart(2, '0');
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthOf = (date) => date.slice(0, 7);
const addMonths = (m, n) => {
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 1 + n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
};
const monthLabel = (m) => {
  const [y, mo] = m.split('-').map(Number);
  const s = new Intl.DateTimeFormat('pt-PT', { month: 'long', year: 'numeric' }).format(new Date(y, mo - 1, 1));
  return s.charAt(0).toUpperCase() + s.slice(1);
};
const shortMonth = (m) => {
  const [y, mo] = m.split('-').map(Number);
  return new Intl.DateTimeFormat('pt-PT', { month: 'short', year: '2-digit' }).format(new Date(y, mo - 1, 1));
};

const KINDS = { emprestimo: 'Empréstimo', cartao: 'Cartão de crédito', outro: 'Outra dívida' };

// ---------- estado e API ----------
let db = { sources: [], income_types: [], incomes: [], debts: [], debt_events: [], bills: [], bill_payments: [] };
let tab = 'resumo';
let month = monthOf(localDate());

const STORE = 'contas_db_v1';
const EMPTY = () => ({ sources: [], income_types: [], incomes: [], debts: [], debt_events: [], bills: [], bill_payments: [] });

function loadStore() {
  try {
    return { ...EMPTY(), ...JSON.parse(localStorage.getItem(STORE) || '{}') };
  } catch {
    return EMPTY();
  }
}

// Mesma interface que a versão com servidor, mas tudo fica guardado neste aparelho (localStorage).
async function api(method, path, body) {
  const store = loadStore();
  if (method === 'GET' && path === 'all') return store;
  const [table, idStr] = path.split('/');
  const rows = store[table];
  const id = Number(idStr);
  let out = { ok: true };
  if (method === 'POST') {
    if (table === 'bill_payments') store[table] = rows.filter((r) => !(r.bill_id === body.bill_id && r.month === body.month));
    out = { id: Math.max(0, ...rows.map((r) => r.id)) + 1, ...body };
    store[table].push(out);
  } else if (method === 'PUT') {
    out = Object.assign(rows.find((r) => r.id === id), body);
  } else if (method === 'DELETE') {
    store[table] = rows.filter((r) => r.id !== id);
    if (table === 'debts') store.debt_events = store.debt_events.filter((e) => e.debt_id !== id);
    if (table === 'income_types') store.incomes.forEach((r) => { if (r.type_id === id) r.type_id = null; });
    if (table === 'bills') store.bill_payments = store.bill_payments.filter((p) => p.bill_id !== id);
    if (table === 'sources') for (const t of ['incomes', 'income_types', 'debts', 'bills']) store[t].forEach((r) => { if (r.source_id === id) r.source_id = null; });
  }
  localStorage.setItem(STORE, JSON.stringify(store));
  return out;
}

async function reload() {
  db = await api('GET', 'all');
  render();
}

async function run(fn) {
  try {
    await fn();
    await reload();
  } catch (e) {
    alert(e.message);
  }
}

// ---------- cálculos ----------
const sourceName = (id) => db.sources.find((s) => s.id === id)?.name || 'Sem conta';

// Só considera o mês de início se vier no formato AAAA-MM (num browser sem seletor de mês é texto livre).
const hasStart = (d) => /^\d{4}-\d{2}$/.test(d.start_month || '');

function debtStats(d) {
  const ev = db.debt_events.filter((e) => e.debt_id === d.id);
  const paid = sum(ev.filter((e) => e.type === 'pagamento'), (e) => e.amount);
  const added = sum(ev.filter((e) => e.type === 'acrescimo'), (e) => e.amount);
  const owed = d.initial_balance + added;
  const balance = Math.max(0, owed - paid);
  const paidCount = ev.filter((e) => e.type === 'pagamento' && e.month).length;
  let remaining = null;
  if (d.installment_amount > 0) {
    remaining = d.installments_total ? Math.max(0, d.installments_total - paidCount) : Math.ceil(balance / d.installment_amount);
    if (balance <= 0) remaining = 0;
  }
  const paidThisMonth = ev.some((e) => e.type === 'pagamento' && e.month === monthOf(localDate()));
  // Com mês de início e nº de prestações, o fim é fixo no calendário; senão, estima-se a partir de hoje.
  const endMonth = !remaining
    ? null
    : hasStart(d) && d.installments_total
      ? addMonths(d.start_month, d.installments_total - 1)
      : addMonths(monthOf(localDate()), remaining - (paidThisMonth ? 0 : 1));
  return { ev, paid, added, owed, balance, paidCount, remaining, endMonth };
}

function monthItems(m) {
  const items = [];
  for (const d of db.debts) {
    if (!(d.installment_amount > 0)) continue;
    const ref = db.debt_events.find((e) => e.debt_id === d.id && e.type === 'pagamento' && e.month === m);
    if (!ref && debtStats(d).balance <= 0) continue;
    // Janela de cobrança: do mês da 1.ª prestação até à última (se o nº de prestações for conhecido).
    // Um pagamento já registado nesse mês aparece sempre, mesmo fora da janela.
    if (!ref && hasStart(d)) {
      if (m < d.start_month) continue;
      if (d.installments_total && m >= addMonths(d.start_month, d.installments_total)) continue;
    }
    items.push({ kind: 'debt', id: d.id, name: 'Prestação · ' + d.name, amount: ref ? ref.amount : d.installment_amount, day: d.due_day, source_id: d.source_id, ref });
  }
  for (const b of db.bills) {
    let day = b.due_day;
    if (b.recurrence === 'avulsa') {
      if (!b.due_date || monthOf(b.due_date) !== m) continue;
      day = Number(b.due_date.slice(8));
    }
    const ref = db.bill_payments.find((p) => p.bill_id === b.id && p.month === m);
    items.push({ kind: 'bill', id: b.id, name: b.name, amount: ref ? ref.amount : b.amount, day, source_id: b.source_id, ref });
  }
  return items.sort((a, b) => (a.day || 99) - (b.day || 99));
}

// Linhas mês a mês para um conjunto de dívidas (opcionalmente com contas pagas e recebimentos).
// Cada entrada vale só para o mês da sua data (o salário de cada mês é registado no próprio mês).
const incomesFor = (m) => db.incomes.filter((i) => i.date && monthOf(i.date) === m);

function sourceSplit(items, incs) {
  const ids = [...new Set([...db.sources.map((s) => s.id), ...items.map((i) => i.source_id), ...incs.map((i) => i.source_id)])];
  return ids
    .map((id) => ({ id, inn: sum(incs.filter((i) => i.source_id === id), (i) => i.amount), out: sum(items.filter((i) => i.source_id === id), (i) => i.amount) }))
    .filter((x) => x.inn || x.out);
}

function monthRows(debts, withBills) {
  const ids = new Set(debts.map((d) => d.id));
  const evs = db.debt_events.filter((e) => ids.has(e.debt_id));
  const cur = monthOf(localDate());
  const months = evs.map((e) => monthOf(e.date));
  if (withBills) months.push(...db.bill_payments.map((p) => monthOf(p.paid_on)));
  const first = months.reduce((a, m) => (m < a ? m : a), cur);
  const init = sum(debts, (d) => d.initial_balance);
  const signed = (e) => (e.type === 'acrescimo' ? e.amount : -e.amount);
  const rows = [];
  for (let m = first; m <= cur; m = addMonths(m, 1)) {
    const inM = evs.filter((e) => monthOf(e.date) === m);
    const row = {
      m,
      paid: sum(inM.filter((e) => e.type === 'pagamento'), (e) => e.amount),
      added: sum(inM.filter((e) => e.type === 'acrescimo'), (e) => e.amount),
      balance: Math.max(0, init + sum(evs.filter((e) => e.date <= m + '-31'), signed)),
    };
    if (withBills) {
      row.bills = sum(db.bill_payments.filter((p) => monthOf(p.paid_on) === m), (p) => p.amount);
      row.income = sum(incomesFor(m), (i) => i.amount);
    }
    rows.push(row);
  }
  return { rows, init, first };
}

function evolution(debts = db.debts) {
  const { rows, init, first } = monthRows(debts, false);
  return [{ m: addMonths(first, -1), v: init }, ...rows.map((r) => ({ m: r.m, v: r.balance }))].slice(-24);
}

function chartSvg(points) {
  if (points.length < 2 || !points.some((p) => p.v > 0)) return '<div class="empty">Registe pagamentos para ver a evolução.</div>';
  const W = 320, H = 150, top = 14, bot = 22;
  const max = Math.max(...points.map((p) => p.v)) || 1;
  const x = (i) => 8 + (i * (W - 16)) / (points.length - 1);
  const y = (v) => top + (1 - v / max) * (H - top - bot);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(points.length - 1)},${H - bot} L${x(0)},${H - bot} Z`;
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução da dívida total">
    <path d="${area}" style="fill:var(--accent);opacity:.12"/>
    <path d="${line}" style="fill:none;stroke:var(--accent);stroke-width:2.5"/>
    <circle cx="${x(points.length - 1)}" cy="${y(last.v)}" r="4" style="fill:var(--accent)"/>
    <text x="8" y="${H - 6}" style="fill:var(--muted);font-size:10px">${esc(shortMonth(points[0].m))}</text>
    <text x="${W - 8}" y="${H - 6}" text-anchor="end" style="fill:var(--muted);font-size:10px">${esc(shortMonth(last.m))}</text>
    <text x="8" y="10" style="fill:var(--muted);font-size:10px">${esc(eur(max))}</text>
  </svg>`;
}

// ---------- formulários ----------
const dlg = document.getElementById('dlg');
const form = document.getElementById('form');

function openForm({ title, fields, values, onSave, onDelete }) {
  values = values || {};
  const input = (f) => {
    const v = values[f.k] ?? f.def ?? '';
    const req = f.req ? 'required' : '';
    if (f.t === 'select') {
      return `<select name="${f.k}" ${req}>${f.opts.map(([val, lab]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
    }
    const type = f.t === 'number' ? 'number" step="any" inputmode="decimal' : f.t || 'text';
    return `<input name="${f.k}" type="${type}" value="${esc(v)}" ${req}>`;
  };
  form.innerHTML = `<h1>${esc(title)}</h1>
    ${fields.map((f) => `<label>${esc(f.l)}${input(f)}</label>`).join('')}
    <div class="actions">
      <button class="btn" value="ok">Guardar</button>
      <button class="btn sec" value="cancel" formnovalidate>Cancelar</button>
      ${onDelete ? '<button class="btn sec danger" value="del" formnovalidate>Excluir</button>' : ''}
    </div>`;
  form.onsubmit = (ev) => {
    const action = ev.submitter?.value;
    if (action === 'cancel') return;
    ev.preventDefault();
    if (action === 'del') {
      if (confirm('Excluir mesmo?')) {
        dlg.close();
        run(onDelete);
      }
      return;
    }
    const out = {};
    for (const f of fields) {
      const raw = form.elements[f.k].value;
      if (raw === '') out[f.k] = null;
      else out[f.k] = f.t === 'number' || f.k.endsWith('_id') ? Number(raw) : raw;
    }
    dlg.close();
    run(() => onSave(out));
  };
  if (dlg.open) dlg.close();
  dlg.showModal();
}

const sourceOpts = () => [['', '—'], ...db.sources.map((s) => [s.id, s.name])];
const num = (k, l, extra = {}) => ({ k, l, t: 'number', ...extra });

function editSource(s) {
  openForm({
    title: s ? 'Editar conta' : 'Nova conta',
    fields: [{ k: 'name', l: 'Nome (ex.: Conta principal, Cartão de benefícios)', req: true }],
    values: s,
    onSave: (v) => (s ? api('PUT', 'sources/' + s.id, v) : api('POST', 'sources', v)),
    onDelete: s && (() => api('DELETE', 'sources/' + s.id)),
  });
}

function editIncomeType(t) {
  openForm({
    title: t ? 'Editar tipo de entrada' : 'Novo tipo de entrada',
    fields: [
      { k: 'name', l: 'Nome (ex.: Salário, Coverflex)', req: true },
      num('amount', 'Valor habitual (€), opcional'),
      { k: 'source_id', l: 'Costuma entrar em', t: 'select', opts: sourceOpts() },
    ],
    values: t,
    onSave: (v) => (t ? api('PUT', 'income_types/' + t.id, v) : api('POST', 'income_types', v)),
    onDelete: t && (() => api('DELETE', 'income_types/' + t.id)),
  });
}

function editIncome(i, date) {
  if (!db.income_types.length) {
    alert('Crie primeiro um tipo de entrada (ex.: Salário, Coverflex).');

function calendarHtml(items, incs) {
  const [y, mo] = month.split('-').map(Number);
  const lead = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const days = new Date(y, mo, 0).getDate();
  const today = localDate();
  let cells = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map((d) => `<div class="dow">${d}</div>`).join('') + '<i></i>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const date = `${month}-${pad(d)}`;
    const out = items.filter((i) => i.day === d);
    const dots = [
      incs.some((i) => i.date === date) ? '<s class="dot g"></s>' : '',
      out.some((i) => !i.ref) ? '<s class="dot r"></s>' : '',
      out.length && out.every((i) => i.ref) ? '<s class="dot k"></s>' : '',
    ].join('');
    cells += `<button class="day ${date === today ? 'today' : ''}" data-act="day" data-date="${date}"><span>${d}</span><div class="dots">${dots}</div></button>`;
  }
  return `<div class="card"><div class="cal">${cells}</div>
    <div class="legend muted"><s class="dot g"></s> entrada <s class="dot r"></s> a pagar <s class="dot k"></s> pago · toque num dia para adicionar</div></div>`;
}

// Entradas por tipo: uma coluna por tipo, uma linha por mês.
function incomeMatrix() {
  const group = (i) => (i.type_id && find(db.income_types, i.type_id)?.name) || i.name || 'Sem tipo';
  const incs = db.incomes.filter((i) => i.date);
  const cur = monthOf(localDate());
  const cols = [...new Set(incs.map(group))];
  const first = incs.reduce((a, i) => (monthOf(i.date) < a ? monthOf(i.date) : a), cur);
  const last = incs.reduce((a, i) => (monthOf(i.date) > a ? monthOf(i.date) : a), cur);
  const months = [];
  for (let m = first; m <= last; m = addMonths(m, 1)) months.push(m);
  const cell = (m, c) => sum(incs.filter((i) => monthOf(i.date) === m && group(i) === c), (i) => i.amount);
  return { cols, months: months.slice(-24), cell };
}

// Contas a pagar por nome: valores pagos nos últimos 6 meses e variação entre os dois últimos pagamentos.
function billMatrix() {
  const cur = monthOf(localDate());
  const months = [5, 4, 3, 2, 1, 0].map((k) => addMonths(cur, -k));
  const rows = db.bills
    .map((b) => {
      const pays = db.bill_payments.filter((p) => p.bill_id === b.id).sort((x, y) => x.month.localeCompare(y.month));
      if (!pays.length) return null;
      const [prev, last] = pays.slice(-2).length === 2 ? pays.slice(-2) : [null, pays[pays.length - 1]];
      const diff = prev ? last.amount - prev.amount : null;
      return { name: b.name, cells: months.map((m) => sum(pays.filter((p) => p.month === m), (p) => p.amount)), diff, pct: prev && prev.amount ? (diff / prev.amount) * 100 : null };
    })
    .filter(Boolean);
  return { months, rows };
}
const varText = (r) => (r.diff === null ? '–' : `${r.diff >= 0 ? '+' : '−'}${eur(Math.abs(r.diff))}${r.pct === null ? '' : ` (${r.pct >= 0 ? '+' : '−'}${Math.abs(Math.round(r.pct))}%)`}`);

// Atrasos: o que ficou por pagar depois do vencimento (mês atual e 2 anteriores).
function lateItems() {
  const today = localDate();
  const cur = monthOf(today);
  const out = [];
  for (const k of [2, 1, 0]) {
    const m = addMonths(cur, -k);
    const [y, mo] = m.split('-').map(Number);
    for (const it of monthItems(m)) {
      if (it.ref || !it.day) continue;
      const due = `${m}-${pad(Math.min(it.day, new Date(y, mo, 0).getDate()))}`;
      if (due >= today) continue;
      out.push({ ...it, m, due, days: Math.round((new Date(today) - new Date(due)) / 864e5) });
    }
  }
  return out.sort((a, b) => b.days - a.days);
}

function viewRelExtra() {
  const opts = repOptions();
  const title = opts.find(([v]) => v === repSel)[1];
  let body = '';
  if (repSel === 'rep:entradas') {
    const { cols, months, cell } = incomeMatrix();
    const shown = [...months].reverse();
    body = cols.length
      ? `<div class="card tw"><table>
        <tr><th>Mês</th>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}<th>Total</th></tr>
        ${shown.map((m) => `<tr><td>${esc(shortMonth(m))}</td>${cols.map((c) => `<td>${cell(m, c) ? eur(cell(m, c)) : '–'}</td>`).join('')}<td><b>${eur(sum(cols, (c) => cell(m, c)))}</b></td></tr>`).join('')}
        <tfoot><tr><td>Total</td>${cols.map((c) => `<td>${eur(sum(months, (m) => cell(m, c)))}</td>`).join('')}<td>${eur(sum(months, (m) => sum(cols, (c) => cell(m, c))))}</td></tr></tfoot>
      </table></div>`
      : '<div class="empty">Ainda sem entradas registadas.</div>';
  } else if (repSel === 'rep:contas') {
    const { months, rows } = billMatrix();
    body = rows.length
      ? `<div class="card tw"><table>
        <tr><th>Conta</th>${months.map((m) => `<th>${esc(shortMonth(m))}</th>`).join('')}<th>Var. último vs anterior</th></tr>
        ${rows.map((r) => `<tr><td>${esc(r.name)}</td>${r.cells.map((v) => `<td>${v ? eur(v) : '–'}</td>`).join('')}<td class="${r.diff > 0 ? 'bad' : r.diff < 0 ? 'good' : ''}">${varText(r)}</td></tr>`).join('')}
        <tfoot><tr><td>Total</td>${months.map((_, i) => `<td>${eur(sum(rows, (r) => r.cells[i]))}</td>`).join('')}<td></td></tr></tfoot>
      </table></div><div class="muted">Só conta o que marcou como pago. A variação compara os dois últimos pagamentos de cada conta.</div>`
      : '<div class="empty">Ainda sem contas pagas. Marque contas como pagas em Mês.</div>';
  } else {
    const late = lateItems();
    body = late.length
      ? `<div class="card row"><span>Total em atraso</span><b class="bad">${eur(sum(late, (l) => l.amount))}</b></div>
        ${late.map((l) => `<div class="card row" data-act="late-pay" data-m="${l.m}" data-kind="${l.kind}" data-id="${l.id}"><span>${esc(l.name)}<div class="muted">venceu ${esc(l.due.slice(8))}/${esc(l.due.slice(5, 7))} · ${esc(sourceName(l.source_id))}</div></span><span style="text-align:right"><b>${eur(l.amount)}</b><div class="bad muted">${l.days} ${l.days === 1 ? 'dia' : 'dias'} de atraso</div></span></div>`).join('')}
        <div class="muted">Considera o mês atual e os 2 anteriores. Toque numa linha para registar o pagamento.</div>`
      : '<div class="empty">Nada em atraso.</div>';
  }
  return `<h1>Relatórios</h1>${repSelect(opts)}
    <h2>${esc(title)} · ${esc(localDate())}</h2>
    ${body}
    <div class="actions noprint">
      <button class="btn" data-act="rel-csv">Exportar CSV</button>
      <button class="btn sec" data-act="rel-print">Imprimir / PDF</button>
    </div>`;
}

function extraCsv() {
  if (repSel === 'rep:entradas') {
    const { cols, months, cell } = incomeMatrix();
    return csvOut([['Mês', ...cols, 'Total'].map(csvQ), ...months.map((m) => [m, ...cols.map((c) => csvN(cell(m, c))), csvN(sum(cols, (c) => cell(m, c)))])]);
  }
  if (repSel === 'rep:contas') {
    const { months, rows } = billMatrix();
    return csvOut([['Conta', ...months, 'Variação', 'Variação %'].map(csvQ), ...rows.map((r) => [csvQ(r.name), ...r.cells.map(csvN), r.diff === null ? '' : csvN(r.diff), r.pct === null ? '' : csvN(r.pct)])]);
  }
  return csvOut([['Conta', 'Vencimento', 'Dias de atraso', 'Valor', 'Debitada de'].map(csvQ), ...lateItems().map((l) => [csvQ(l.name), l.due, l.days, csvN(l.amount), csvQ(sourceName(l.source_id))])]);
}

function reportData() {
  const debts = repDebts();
  const geral = repSel === 'geral';
  const { rows } = monthRows(debts, geral);
  const stats = debts.map((d) => ({ d, ...debtStats(d) }));
  return { debts, geral, rows, stats };
}

function viewRel() {
  if (repSel.startsWith('rep:')) return viewRelExtra();
  const { debts, geral, rows, stats } = reportData();
  const opts = repOptions();
  const title = opts.find(([v]) => v === repSel)?.[1] || 'Geral';
  const t = (n) => (n ? eur(n) : '–');
  const shown = [...rows].reverse().slice(0, 24);
  const tot = (f) => sum(rows, f);
  return `<h1>Relatórios</h1>
    ${repSelect(opts)}
    <h2>${esc(title)} · ${esc(localDate())}</h2>
    <div class="card">
      <div class="row"><span>Em dívida agora</span><b class="${sum(stats, (s) => s.balance) > 0 ? 'bad' : 'good'}">${eur(sum(stats, (s) => s.balance))}</b></div>
      <div class="row"><span>Total já pago</span><b class="good">${eur(sum(stats, (s) => s.paid))}</b></div>
      <div class="row"><span>Acréscimos (juros, compras)</span><b>${eur(sum(stats, (s) => s.added))}</b></div>
      <div class="row"><span>Prestações por mês</span><b>${eur(sum(debts, (d) => d.installment_amount))}</b></div>
    </div>
    <div class="card"><div class="muted">Evolução do saldo</div>${chartSvg(evolution(debts))}</div>
    ${debts.length > 1 ? `<h2>Por dívida</h2><div class="card tw"><table>
      <tr><th>Dívida</th><th>Saldo</th><th>Pago</th><th>%</th><th>Prest.</th><th>Faltam</th><th>Fim</th></tr>
      ${stats.map((s) => `<tr><td>${esc(s.d.name)}</td><td>${eur(s.balance)}</td><td>${eur(s.paid)}</td><td>${s.owed > 0 ? Math.round((s.paid / s.owed) * 100) : 0}%</td><td>${t(s.d.installment_amount)}</td><td>${s.remaining ?? '–'}</td><td>${s.endMonth ? esc(shortMonth(s.endMonth)) : '–'}</td></tr>`).join('')}
      <tfoot><tr><td>Total</td><td>${eur(sum(stats, (s) => s.balance))}</td><td>${eur(sum(stats, (s) => s.paid))}</td><td></td><td>${eur(sum(debts, (d) => d.installment_amount))}</td><td></td><td></td></tr></tfoot>
    </table></div>` : ''}
    <h2>Mês a mês</h2>
    <div class="card tw"><table>
      <tr><th>Mês</th>${geral ? '<th>Receb.</th>' : ''}<th>Pago</th>${geral ? '<th>Contas</th>' : ''}<th>Acrésc.</th><th>Saldo</th>${geral ? '<th>Sobra</th>' : ''}</tr>
      ${shown.map((r) => `<tr><td>${esc(shortMonth(r.m))}</td>${geral ? `<td>${t(r.income)}</td>` : ''}<td>${t(r.paid)}</td>${geral ? `<td>${t(r.bills)}</td>` : ''}<td>${t(r.added)}</td><td>${eur(r.balance)}</td>${geral ? `<td class="${r.income - r.paid - r.bills < 0 ? 'bad' : ''}">${eur(r.income - r.paid - r.bills)}</td>` : ''}</tr>`).join('')}
      <tfoot><tr><td>Total</td>${geral ? `<td>${eur(tot((r) => r.income))}</td>` : ''}<td>${eur(tot((r) => r.paid))}</td>${geral ? `<td>${eur(tot((r) => r.bills))}</td>` : ''}<td>${eur(tot((r) => r.added))}</td><td></td>${geral ? `<td>${eur(tot((r) => r.income - r.paid - r.bills))}</td>` : ''}</tr></tfoot>
    </table></div>
    ${geral ? '<div class="muted">Receb. = recebimentos mensais registados. Contas = contas a pagar já pagas. Sobra = Receb. − Pago − Contas.</div>' : ''}
    <div class="actions noprint">
      <button class="btn" data-act="rel-csv">Exportar CSV</button>
      <button class="btn sec" data-act="rel-print">Imprimir / PDF</button>
    </div>`;
}

function reportCsv() {
  if (repSel.startsWith('rep:')) return extraCsv();
  const { geral, rows, stats } = reportData();
  const n = (v) => String(Math.round((v || 0) * 100) / 100).replace('.', ',');
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const out = [];
  out.push(['Dívida', 'Tipo', 'Saldo', 'Pago', 'Acréscimos', 'Prestação', 'Prestações em falta', 'Fim previsto'].map(q).join(';'));
  for (const s of stats) out.push([q(s.d.name), q(KINDS[s.d.kind]), n(s.balance), n(s.paid), n(s.added), n(s.d.installment_amount), s.remaining ?? '', s.endMonth || ''].join(';'));
  out.push('');
  out.push((geral ? ['Mês', 'Recebimentos', 'Pago em dívidas', 'Contas pagas', 'Acréscimos', 'Saldo dívida', 'Sobra'] : ['Mês', 'Pago', 'Acréscimos', 'Saldo dívida']).map(q).join(';'));
  for (const r of rows) out.push((geral ? [r.m, n(r.income), n(r.paid), n(r.bills), n(r.added), n(r.balance), n(r.income - r.paid - r.bills)] : [r.m, n(r.paid), n(r.added), n(r.balance)]).join(';'));
  return '\uFEFF' + out.join('\n');
}

const VIEWS = { rel: viewRel, resumo: viewResumo, mes: viewMes, dividas: viewDividas, contas: viewContas, config: viewConfig };

function render() {
  document.getElementById('view').innerHTML = VIEWS[tab]();
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
}

// ---------- eventos ----------
const find = (list, id) => list.find((x) => x.id === Number(id));

document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('#nav button');
  if (navBtn) {
    tab = navBtn.dataset.tab;
    window.scrollTo(0, 0);
    return render();
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id, kind } = el.dataset;
  if (el.closest('dialog')) dlg.close();
  const item = () => monthItems(month).find((i) => i.kind === kind && i.id === Number(id));
  switch (act) {
    case 'month': month = addMonths(month, Number(el.dataset.d)); return render();
    case 'toggle': {
      const it = item();
      return run(() => (it.ref ? removePayment(it) : savePayment(it, it.amount, localDate())));
    }
    case 'pay': return editPayment(item());
    case 'debt-new': return editDebt();
    case 'debt-edit': return editDebt(find(db.debts, id));
    case 'debt-pay': return debtMovement(find(db.debts, id), 'pagamento');
    case 'debt-add': return debtMovement(find(db.debts, id), 'acrescimo');
    case 'ev-del': return confirm('Excluir este movimento?') && run(() => api('DELETE', 'debt_events/' + id));
    case 'bill-new': return editBill(null, el.dataset.date);
    case 'day': return openDay(el.dataset.date);
    case 'late-pay': month = el.dataset.m; return editPayment(item());
    case 'type-new': return editIncomeType();
    case 'type-edit': return editIncomeType(find(db.income_types, id));
    case 'bill-edit': return editBill(find(db.bills, id));
    case 'src-new': return editSource();
    case 'src-edit': return editSource(find(db.sources, id));
    case 'inc-new': return editIncome(null, el.dataset.date);
    case 'inc-edit': return editIncome(find(db.incomes, id));
    case 'export': return exportData();
    case 'rel-csv': return shareFile(`relatorio-${localDate()}.csv`, reportCsv(), 'text/csv');
    case 'rel-print': return window.print();
    case 'import': return document.getElementById('imp').click();
  }
});

// ---------- arranque ----------
reload();
navigator.storage?.persist?.(); // pede ao Safari para não apagar os dados automaticamente

async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file] });
    else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = name;
      a.click();
    }
    return true;
  } catch (e) {
    if (e.name !== 'AbortError') alert(e.message);
    return false;
  }
}

async function exportData() {
  if (await shareFile(`contas-${localDate()}.json`, JSON.stringify(db, null, 2), 'application/json')) {
    localStorage.setItem('contas_last_export', localDate());
    render();
  }
}

document.addEventListener('change', async (e) => {
  if (e.target.id === 'repSel') {
    repSel = e.target.value;
    return render();
  }
  if (e.target.id !== 'imp' || !e.target.files[0]) return;
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(data.debts) || !Array.isArray(data.bills)) throw new Error('Ficheiro inválido.');
    if (!confirm('Substituir TODOS os dados atuais pelos do ficheiro?')) return;
    localStorage.setItem(STORE, JSON.stringify({ ...EMPTY(), ...data }));
    await reload();
  } catch (err) {
    alert(err.message);
  } finally {
    e.target.value = '';
  }
});
